name: Legacy Backend CI (manual diagnostics)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Test FastAPI backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ${{ vars.DATABASE_NAME }}
          POSTGRES_USER: ${{ vars.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: ${{ vars.DATABASE_HOST }}
      DATABASE_PORT: ${{ vars.DATABASE_PORT }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}
      DATABASE_USER: ${{ vars.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
    defaults:
      run:
        working-directory: backend
    outputs:
      install_result: ${{ steps.install.outcome }}
      migration_result: ${{ steps.migrate.outcome }}
      test_result: ${{ steps.test.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        id: install
        run: python -m pip install -r requirements-dev.txt

      - name: Create place, operational, and itinerary tables
        id: migrate
        run: python scripts/apply_migrations.py --apply

      - name: Run backend tests
        id: test
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing:skip-covered
          --cov-fail-under=70

  publish_backend_image:
    name: Publish Backend image to ECR
    needs:
      - backend
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Verify backend ECR settings
        env:
          AWS_BACKEND_ECR_ROLE_ARN: ${{ vars.AWS_BACKEND_ECR_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if [[ -z "$AWS_BACKEND_ECR_ROLE_ARN" ]]; then
            echo "::error::Set the AWS_BACKEND_ECR_ROLE_ARN repository variable before pushing backend images."
            exit 1
          fi
          if [[ -z "$AWS_REGION" ]]; then
            echo "::error::Set the AWS_REGION repository variable."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/seoulwave:$IMAGE_TAG"
          docker build --file backend/Dockerfile --tag "$IMAGE_URI" backend
          docker push "$IMAGE_URI"

  discord_notify:
    name: Notify Backend result on Discord
    needs:
      - backend
      - publish_backend_image
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Backend CI result to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BACKEND_ID: ${{ vars.DISCORD_BACKEND_ID }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_INSTALL_RESULT: ${{ needs.backend.outputs.install_result }}
          BACKEND_MIGRATION_RESULT: ${{ needs.backend.outputs.migration_result }}
          BACKEND_TEST_RESULT: ${{ needs.backend.outputs.test_result }}
          BACKEND_IMAGE_RESULT: ${{ needs.publish_backend_image.result }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook_url:
              print("DISCORD_WEBHOOK_URL is not configured")
              raise SystemExit(1)

          webhook_parts = urlsplit(webhook_url)
          webhook_path_is_valid = re.fullmatch(
              r"/api/(?:v[0-9]+/)?webhooks/[0-9]{17,20}/[A-Za-z0-9._-]+",
              webhook_parts.path,
          )
          if (
              webhook_parts.scheme != "https"
              or webhook_parts.hostname not in {"discord.com", "discordapp.com"}
              or not webhook_path_is_valid
          ):
              print("DISCORD_WEBHOOK_URL 형식 확인 필요")
              raise SystemExit(1)
          print("Discord webhook URL 형식: 유효")

          lines = []
          mentioned_users = []
          result = os.environ.get("BACKEND_RESULT", "unknown")

          if result != "success":
              install_result = os.environ.get("BACKEND_INSTALL_RESULT", "")
              migration_result = os.environ.get("BACKEND_MIGRATION_RESULT", "")
              test_result = os.environ.get("BACKEND_TEST_RESULT", "")

              if install_result == "failure":
                  failed_stage = "Dependency installation (pip install)"
              elif migration_result == "failure":
                  failed_stage = "PostgreSQL migration setup"
              elif test_result == "failure":
                  failed_stage = "Backend tests / 70% coverage gate"
              else:
                  failed_stage = "Backend check"

              lines.extend([
                  "🚨 SEOUL WAVE Backend CI 실패",
                  f"실패 단계 — {failed_stage}",
              ])
              backend_id = os.environ.get("DISCORD_BACKEND_ID", "").strip()
              if re.fullmatch(r"[0-9]{17,20}", backend_id):
                  lines.append(f"Backend 담당자 — <@{backend_id}>")
                  mentioned_users.append(backend_id)
                  print("Backend 담당자 멘션 설정: 사용")
              else:
                  lines.append("Backend 담당자 멘션 — DISCORD_BACKEND_ID 미설정 또는 형식 확인 필요")
                  print("Backend 담당자 멘션 설정: 미사용")
          elif os.environ.get("BACKEND_IMAGE_RESULT", "skipped") == "failure":
              lines.extend([
                  "🚨 SEOUL WAVE Backend ECR 이미지 업로드 실패",
                  "실패 단계 — AWS OIDC 인증 또는 ECR 이미지 빌드·푸시",
              ])
              backend_id = os.environ.get("DISCORD_BACKEND_ID", "").strip()
              if re.fullmatch(r"[0-9]{17,20}", backend_id):
                  lines.append(f"Backend 담당자 — <@{backend_id}>")
                  mentioned_users.append(backend_id)
              else:
                  lines.append("Backend 담당자 멘션 — DISCORD_BACKEND_ID 미설정 또는 형식 확인 필요")
          elif os.environ.get("BACKEND_IMAGE_RESULT", "skipped") == "success":
              lines = ["✅ SEOUL WAVE Backend CI 통과 및 ECR 이미지 업로드 완료"]
          else:
              lines = ["✅ SEOUL WAVE Backend CI 성공"]

          lines.extend([
              f"브랜치 — {os.environ.get('BRANCH_NAME', 'unknown')}",
              f"Commit — {os.environ.get('COMMIT_SHA', 'unknown')}",
              f"실행 로그 — {os.environ.get('RUN_URL', '')}",
          ])

          allowed_mentions = {"parse": []}
          if mentioned_users:
              allowed_mentions["users"] = mentioned_users

          payload = {
              "content": "\n".join(lines),
              "allowed_mentions": allowed_mentions,
          }
          request = Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "HanGangLocalPass-GitHubActions/1.0",
              },
              method="POST",
          )

          try:
              with urlopen(request, timeout=20) as response:
                  status_code = response.status
          except HTTPError as error:
              print(f"Discord webhook HTTP 응답: {error.code}")
              raise SystemExit(1)
          except (URLError, TimeoutError, OSError) as error:
              print(f"Discord webhook 요청 실패: {type(error).__name__}")
              raise SystemExit(1)

          print(f"Discord webhook HTTP 응답: {status_code}")
          if not 200 <= status_code < 300:
              raise SystemExit(1)
          PY
