name: Legacy combined CI (manual diagnostics)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Test FastAPI backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ${{ vars.DATABASE_NAME }}
          POSTGRES_USER: ${{ vars.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_HOST: ${{ vars.DATABASE_HOST }}
      DATABASE_PORT: ${{ vars.DATABASE_PORT }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}
      DATABASE_USER: ${{ vars.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
    outputs:
      install_result: ${{ steps.backend_install.outcome }}
      migration_result: ${{ steps.backend_migrate.outcome }}
      test_result: ${{ steps.backend_test.outcome }}
      health_result: ${{ steps.backend_health.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        id: backend_install
        run: python -m pip install -r requirements-dev.txt

      - name: Create place, operational, and itinerary tables
        id: backend_migrate
        run: python scripts/apply_migrations.py --apply

      - name: Run backend tests
        id: backend_test
        run: >-
          python -m pytest -q
          --cov=app
          --cov-report=term-missing:skip-covered
          --cov-fail-under=70

      - name: Start FastAPI and check health endpoint
        id: backend_health
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/health; then
              echo "FastAPI started and /health returned HTTP 200"
              exit 0
            fi
            sleep 1
          done

          cat uvicorn.log
          echo "FastAPI did not start within 20 seconds"
          exit 1

  frontend:
    name: Test React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      install_result: ${{ steps.install.outcome }}
      test_result: ${{ steps.test.outcome }}
      build_result: ${{ steps.build.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        id: install
        run: npm ci

      - name: Run frontend tests
        id: test
        run: npm test

      - name: Build frontend
        id: build
        run: npm run build

  discord_notify:
    name: Notify Discord
    needs:
      - backend
      - frontend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send CI result to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FRONTEND_ID: ${{ vars.DISCORD_FRONTEND_ID }}
          DISCORD_BACKEND_ID: ${{ vars.DISCORD_BACKEND_ID }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_INSTALL_RESULT: ${{ needs.backend.outputs.install_result }}
          BACKEND_MIGRATION_RESULT: ${{ needs.backend.outputs.migration_result }}
          BACKEND_TEST_RESULT: ${{ needs.backend.outputs.test_result }}
          BACKEND_HEALTH_RESULT: ${{ needs.backend.outputs.health_result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_INSTALL_RESULT: ${{ needs.frontend.outputs.install_result }}
          FRONTEND_TEST_RESULT: ${{ needs.frontend.outputs.test_result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend.outputs.build_result }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook_url:
              print("DISCORD_WEBHOOK_URL is not configured")
              raise SystemExit(1)

          webhook_parts = urlsplit(webhook_url)
          webhook_path_is_valid = re.fullmatch(
              r"/api/(?:v[0-9]+/)?webhooks/[0-9]{17,20}/[A-Za-z0-9._-]+",
              webhook_parts.path,
          )
          if (
              webhook_parts.scheme != "https"
              or webhook_parts.hostname not in {"discord.com", "discordapp.com"}
              or not webhook_path_is_valid
          ):
              print("DISCORD_WEBHOOK_URL 형식 확인 필요")
              raise SystemExit(1)
          print("Discord webhook URL 형식: 유효")

          backend_result = os.environ.get("BACKEND_RESULT", "unknown")
          frontend_result = os.environ.get("FRONTEND_RESULT", "unknown")
          lines = []
          mentioned_users = []

          if backend_result != "success":
              install_result = os.environ.get("BACKEND_INSTALL_RESULT", "")
              migration_result = os.environ.get("BACKEND_MIGRATION_RESULT", "")
              test_result = os.environ.get("BACKEND_TEST_RESULT", "")
              health_result = os.environ.get("BACKEND_HEALTH_RESULT", "")
              if install_result == "failure":
                  failed_stage = "의존성 설치"
              elif migration_result == "failure":
                  failed_stage = "PostgreSQL migration setup"
              elif test_result == "failure":
                  failed_stage = "pytest / 70% coverage gate"
              elif health_result == "failure":
                  failed_stage = "FastAPI 실행 / Health Check"
              else:
                  failed_stage = "Backend 검사"

              lines.extend([
                  "실패 영역 — Backend",
                  f"실패 단계 — {failed_stage}",
              ])
              backend_id = os.environ.get("DISCORD_BACKEND_ID", "").strip()
              if re.fullmatch(r"[0-9]{17,20}", backend_id):
                  lines.append(f"Backend 담당자 — <@{backend_id}>")
                  mentioned_users.append(backend_id)
                  print("Backend 담당자 멘션 설정: 사용")
              else:
                  lines.append("Backend 담당자 멘션 — DISCORD_BACKEND_ID 미설정 또는 형식 확인 필요")
                  print("Backend 담당자 멘션 설정: 미사용")

          if frontend_result != "success":
              install_result = os.environ.get("FRONTEND_INSTALL_RESULT", "")
              test_result = os.environ.get("FRONTEND_TEST_RESULT", "")
              build_result = os.environ.get("FRONTEND_BUILD_RESULT", "")

              if test_result == "failure":
                  failed_stage = "Test"
              elif build_result == "failure":
                  failed_stage = "Build"
              elif install_result == "failure":
                  failed_stage = "Build 준비 (npm ci)"
              else:
                  failed_stage = "Frontend 검사"

              lines.extend([
                  "실패 영역 — Frontend",
                  f"실패 단계 — {failed_stage}",
              ])
              frontend_id = os.environ.get("DISCORD_FRONTEND_ID", "").strip()
              if re.fullmatch(r"[0-9]{17,20}", frontend_id):
                  lines.append(f"Frontend 담당자 — <@{frontend_id}>")
                  mentioned_users.append(frontend_id)
                  print("Frontend 담당자 멘션 설정: 사용")
              else:
                  lines.append("Frontend 담당자 멘션 — DISCORD_FRONTEND_ID 미설정 또는 형식 확인 필요")
                  print("Frontend 담당자 멘션 설정: 미사용")

          if lines:
              lines.insert(0, "🚨 한강로컬패스 CI 실패")
              lines.extend([
                  f"브랜치 — {os.environ.get('BRANCH_NAME', 'unknown')}",
                  f"Commit — {os.environ.get('COMMIT_SHA', 'unknown')}",
                  f"실행 로그 — {os.environ.get('RUN_URL', '')}",
              ])
          else:
              lines = [
                  "✅ 한강로컬패스 Frontend CI 성공",
                  f"브랜치 — {os.environ.get('BRANCH_NAME', 'unknown')}",
                  f"Commit — {os.environ.get('COMMIT_SHA', 'unknown')}",
                  f"실행 로그 — {os.environ.get('RUN_URL', '')}",
              ]

          allowed_mentions = {"parse": []}
          if mentioned_users:
              allowed_mentions["users"] = mentioned_users

          payload = {
              "content": "\n".join(lines),
              "allowed_mentions": allowed_mentions,
          }
          request = Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "HanGangLocalPass-GitHubActions/1.0",
              },
              method="POST",
          )

          try:
              with urlopen(request, timeout=20) as response:
                  status_code = response.status
          except HTTPError as error:
              status_code = error.code
              try:
                  error_body = json.loads(error.read().decode("utf-8"))
                  discord_error_code = error_body.get("code")
              except (UnicodeDecodeError, json.JSONDecodeError, AttributeError):
                  discord_error_code = None

              webhook_host = urlsplit(webhook_url).hostname or "unknown"
              response_server = error.headers.get("Server", "unknown")
              response_type = error.headers.get("Content-Type", "unknown")
              print(f"Discord webhook HTTP 응답: {status_code}")
              print(f"Discord webhook 호스트: {webhook_host}")
              print(f"Discord 응답 서버: {response_server}")
              print(f"Discord 응답 형식: {response_type}")
              if isinstance(discord_error_code, (int, str)) and str(discord_error_code).isdigit():
                  print(f"Discord 오류 코드: {discord_error_code}")
              raise SystemExit(1)
          except (URLError, TimeoutError, OSError) as error:
              print(f"Discord webhook 요청 실패: {type(error).__name__}")
              raise SystemExit(1)

          print(f"Discord webhook HTTP 응답: {status_code}")
          if not 200 <= status_code < 300:
              raise SystemExit(1)
          PY
