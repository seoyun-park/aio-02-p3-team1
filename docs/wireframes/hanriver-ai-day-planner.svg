<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">한강버스 AI 나들이 플래너 와이어프레임</title>
  <desc id="desc">왼쪽 조건 입력 패널과 오른쪽 추천 코스, 지도, 일정 타임라인으로 구성된 데스크톱 화면 와이어프레임입니다.</desc>
