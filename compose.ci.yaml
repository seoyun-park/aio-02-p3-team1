# Isolated CI only. Never load the repository's local or production .env.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: seoul_wave_ci
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_ephemeral_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_user -d seoul_wave_ci"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
  backend:
    image: ci-backend:${CI_SHA:?CI_SHA must be set}
    environment: &ci_database
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: seoul_wave_ci
      DATABASE_USER: ci_user
      DATABASE_PASSWORD: ci_ephemeral_only
      SITE_ACCESS_PASSWORDS: ci_smoke_password
      SESSION_SECRET: ci_ephemeral_session_secret_not_for_production
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3)"]
      interval: 2s
      timeout: 4s
      retries: 30
  frontend:
    image: ci-frontend:${CI_SHA:?CI_SHA must be set}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: ci-backend-test:${CI_SHA:?CI_SHA must be set}
    environment: *ci_database
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./reports:/reports
